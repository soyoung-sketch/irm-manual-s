<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출관리 판매 흐름도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 960px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }
  svg text { font-family: inherit; }
  .box-blue  { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal  { fill: #e1f5ee; stroke: #0f6e56; }
  .box-gray  { fill: #f4f4f4; stroke: #999; }
  .txt-blue  { fill: #0c447c; }
  .txt-teal  { fill: #085041; }
  .txt-gray  { fill: #444; }
</style>
</head>
<body>
<div class="wrap">
  <h2>6. 매출관리Ⅱ – 판매 흐름도</h2>

  <svg width="100%" viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#888"/>
      </marker>
      <marker id="arr-bold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L9 5 L0 10 Z" fill="#185fa5"/>
      </marker>
      <marker id="arr-bold-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M9 0 L0 5 L9 10 Z" fill="#185fa5"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="879" height="679" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>
    <!-- Header bg -->
    <rect x="0" y="0" width="880" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="880" height="8" fill="#f0f0f0"/>
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 870 0.5 Q 879.5 0.5 879.5 10 L 879.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column divider -->
    <line x1="44" y1="48" x2="44" y2="680" stroke="#ddd" stroke-width="0.8"/>

    <!-- Header -->
    <text x="462" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">사업장</text>

    <!-- 행 라벨 -->
    <text x="22" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">발</text>
    <text x="22" y="322" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">주</text>
    <text x="22" y="338" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">계</text>
    <text x="22" y="354" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">획</text>

    <!-- ════ 판매 등록 dashed box ════ -->
    <rect x="60" y="66" width="260" height="160" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="76" y="83" font-size="11" font-weight="600" fill="#777">판매 등록</text>

    <!-- 판매전표 작성 -->
    <rect x="118" y="116" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="190" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">판매전표 작성</text>

    <!-- 저장 → 판매 입력 -->
    <line x1="262" y1="132" x2="418" y2="132" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="320" y="125" width="40" height="14" rx="2" fill="white"/>
    <text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">저장</text>

    <!-- ════ 판매 조회 dashed box ════ -->
    <rect x="340" y="66" width="510" height="460" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="356" y="83" font-size="11" font-weight="600" fill="#777">판매 조회</text>

    <!-- 판매 입력 -->
    <rect x="418" y="116" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="490" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">판매 입력</text>

    <!-- 판매 입력 → 판매 취소 (우측, 양방향) -->
    <line x1="562" y1="132" x2="660" y2="132" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="593" y="125" width="36" height="14" rx="2" fill="white"/>
    <text x="611" y="132" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">취소</text>

    <!-- 판매 취소 박스 -->
    <rect x="660" y="116" width="144" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="732" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">판매 취소</text>

    <!-- 판매 입력 → 판매(출고) 대기 -->
    <line x1="490" y1="148" x2="490" y2="230" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="462" y="182" width="56" height="14" rx="2" fill="white"/>
    <text x="490" y="189" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">판매대기</text>

    <!-- 판매(출고) 대기 -->
    <rect x="418" y="230" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="490" y="246" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">판매(출고) 대기</text>


    <!-- 판매(출고) 대기 → 판매완료 -->
    <line x1="490" y1="262" x2="490" y2="360" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="462" y="303" width="56" height="14" rx="2" fill="white"/>
    <text x="490" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">매입완료</text>

    <!-- 판매완료 -->
    <rect x="418" y="360" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="490" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">판매완료</text>

    <!-- ════ 본사↔가맹점 프로세스 dashed box ════ -->
    <rect x="630" y="290" width="200" height="220" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="646" y="307" font-size="11" font-weight="600" fill="#777">본사↔가맹점 프로세스</text>

    <!-- 판매가 점검 -->
    <rect x="668" y="333" width="124" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="730" y="349" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">판매가 점검</text>

    <!-- 검수요청 -->
    <rect x="668" y="392" width="124" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="730" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">검수요청</text>

    <!-- 검수 보류 -->
    <rect x="668" y="451" width="124" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="730" y="467" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">검수 보류</text>

    <!-- ════ 재고 수불 발생 양방향 화살표 ════ -->
    <line x1="595" y1="526" x2="595" y2="586" stroke="#185fa5" stroke-width="2.5" marker-start="url(#arr-bold-rev)" marker-end="url(#arr-bold)"/>
    <rect x="527" y="545" width="136" height="22" rx="2" fill="white"/>
    <text x="595" y="556" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#185fa5">재고 수불 발생</text>

    <!-- ════ 재고 관리 박스 ════ -->
    <rect x="340" y="586" width="510" height="60" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="0.8"/>
    <text x="595" y="616" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444">재고 관리</text>

  </svg>
</div>
</body>
</html>
