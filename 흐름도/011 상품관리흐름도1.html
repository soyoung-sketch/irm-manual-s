<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품관리 흐름도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 900px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }

  /* SVG reset */
  svg text { font-family: inherit; }

  /* Boxes */
  .box-blue   { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal   { fill: #e1f5ee; stroke: #0f6e56; }
  .box-purple { fill: #eeedfe; stroke: #534ab7; }
  .box-coral  { fill: #faece7; stroke: #993c1d; }
  .box-amber  { fill: #faeeda; stroke: #854f0b; }

  .txt-blue   { fill: #0c447c; }
  .txt-teal   { fill: #085041; }
  .txt-purple { fill: #3c3489; }
  .txt-coral  { fill: #712b13; }
  .txt-amber  { fill: #633806; }

  .arr { stroke: #888; fill: none; }
  .hdr { fill: #f0f0f0; stroke: #ccc; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: #555; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>2. 상품관리 – 본사 ↔ 가맹점 상품 등록 흐름도 &nbsp;(1 / 3)</h2>

  <svg width="100%" viewBox="0 0 820 590" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="819" height="589" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>

    <!-- Header bg -->
    <rect x="0" y="0" width="820" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="820" height="8" fill="#f0f0f0"/>

    <!-- 헤더 테두리 (하단선 제외, 상단만 라운드) -->
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 810 0.5 Q 819.5 0.5 819.5 10 L 819.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column dividers -->
    <line x1="44" y1="48" x2="44" y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="240" y1="48" x2="240" y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="470" y1="48" x2="470" y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="650" y1="48" x2="650" y2="590" stroke="#ddd" stroke-width="0.6" stroke-dasharray="5 3"/>

    <!-- Section divider -->
    <line x1="0" y1="268" x2="820" y2="268" stroke="#ddd" stroke-width="0.8"/>

    <!-- 헤더 하단 구분선 -->
    <line x1="0" y1="48" x2="820" y2="48" stroke="#ddd" stroke-width="0.8"/>

    <!-- Column headers -->
    <text x="142" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">직영점</text>
    <text x="355" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">본사</text>
    <text x="648" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">가맹점 &amp; 외주센터</text>

    <!-- Section row labels: 개별 text로 각 글자 정확히 중앙 정렬 -->
    <!-- 상품등록: 섹션 중앙 y=158, 4글자×16px=64px → 시작134 -->
    <text x="22" y="134" text-anchor="middle" font-size="11" fill="#888">상</text>
    <text x="22" y="150" text-anchor="middle" font-size="11" fill="#888">품</text>
    <text x="22" y="166" text-anchor="middle" font-size="11" fill="#888">등</text>
    <text x="22" y="182" text-anchor="middle" font-size="11" fill="#888">록</text>
    <!-- 판매가수정: 섹션 중앙 y=429, 5글자×16px=80px → 시작397 -->
    <text x="22" y="397" text-anchor="middle" font-size="11" fill="#888">판</text>
    <text x="22" y="413" text-anchor="middle" font-size="11" fill="#888">매</text>
    <text x="22" y="429" text-anchor="middle" font-size="11" fill="#888">가</text>
    <text x="22" y="445" text-anchor="middle" font-size="11" fill="#888">수</text>
    <text x="22" y="461" text-anchor="middle" font-size="11" fill="#888">정</text>

    <!-- ════ SECTION 1: 상품등록 ════ -->

    <!-- Row 1 boxes (y=70) -->
    <!-- 가맹상품 정보등록 (본사) -->
    <rect x="281" y="70" width="148" height="42" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="91" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-blue">가맹상품 정보등록</text>

    <!-- 사입상품 정보등록 (외주) -->
    <rect x="666" y="70" width="140" height="42" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="91" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-coral">사입상품 정보등록</text>

    <!-- Down arrows row1→row2 -->
    <line x1="355" y1="112" x2="355" y2="158" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="736" y1="112" x2="736" y2="158" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 2 boxes (y=158) -->
    <!-- 가맹상품 자동등록 (직영점) -->
    <rect x="64" y="158" width="152" height="42" rx="7" class="box-teal" stroke-width="0.6"/>
    <text x="140" y="179" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-teal">가맹상품 자동등록</text>

    <!-- 상품정보 전송 (본사) -->
    <rect x="281" y="158" width="148" height="42" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="179" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-blue">상품정보 전송</text>

    <!-- 가맹상품 자동등록 (가맹점) -->
    <rect x="480" y="158" width="152" height="42" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="179" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-purple">가맹상품 자동등록</text>

    <!-- 사입상품 등록 (외주) -->
    <rect x="666" y="158" width="140" height="42" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="179" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-coral">사입상품 등록</text>

    <!-- Bidirectional col1 ↔ col2 -->
    <line x1="216" y1="179" x2="281" y2="179" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- col2 → col3 -->
    <line x1="429" y1="179" x2="480" y2="179" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- ════ SECTION 2: 판매가수정 ════ -->

    <!-- Row 1 boxes (y=286, two-line, h=54) -->
    <!-- 가맹상품 판매가 수정요청 (본사) -->
    <rect x="281" y="286" width="148" height="54" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="305" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-blue">가맹상품 판매가</text>
    <text x="355" y="323" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="txt-blue">수정요청</text>

    <!-- 사입상품 판매가 변경 등록 (외주) -->
    <rect x="666" y="286" width="140" height="54" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="305" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-coral">사입상품 판매가</text>
    <text x="736" y="323" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="txt-coral">변경 등록</text>

    <!-- Down arrow col2 row1→row2 -->
    <line x1="355" y1="340" x2="355" y2="376" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <!-- Down arrow col4 direct to bottom -->
    <line x1="736" y1="340" x2="736" y2="504" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 2 boxes (y=376) -->
    <!-- 수정요청정보 접수 (직영점) -->
    <rect x="64" y="376" width="152" height="42" rx="7" class="box-teal" stroke-width="0.6"/>
    <text x="140" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">수정요청정보 접수</text>

    <!-- 수정요청정보 전송 (본사) -->
    <rect x="281" y="376" width="148" height="42" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">수정요청정보 전송</text>

    <!-- 수정요청정보 접수 (가맹점) -->
    <rect x="480" y="376" width="152" height="42" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-purple">수정요청정보 접수</text>

    <!-- Bidirectional col1 ↔ col2 -->
    <line x1="216" y1="397" x2="281" y2="397" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- col2 → col3 -->
    <line x1="429" y1="397" x2="480" y2="397" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Down arrows row2 → diamonds -->
    <line x1="140" y1="418" x2="140" y2="440" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="556" y1="418" x2="556" y2="440" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Diamond 반영 col1 (center 140,460) -->
    <rect x="120" y="440" width="40" height="40" rx="2" transform="rotate(45,140,460)" class="box-amber" stroke-width="0.6"/>
    <text x="140" y="460" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" class="txt-amber">반영</text>

    <!-- Diamond 반영 col3 (center 556,460) -->
    <rect x="536" y="440" width="40" height="40" rx="2" transform="rotate(45,556,460)" class="box-amber" stroke-width="0.6"/>
    <text x="556" y="460" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" class="txt-amber">반영</text>

    <!-- YES/NO labels -->
    <text x="128" y="490" text-anchor="end" font-size="10.5" fill="#555">YES</text>
    <text x="165" y="456" text-anchor="start" font-size="10.5" fill="#555">NO</text>
    <text x="544" y="490" text-anchor="end" font-size="10.5" fill="#555">YES</text>
    <text x="525" y="456" text-anchor="end" font-size="10.5" fill="#555">NO</text>

    <!-- YES arrows → bottom boxes -->
    <line x1="140" y1="488" x2="140" y2="504" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="556" y1="488" x2="556" y2="504" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- NO L-paths → 수정요청 적용유무 (col2 bottom center_y=525) -->
    <path d="M 168 460 H 234 V 525 H 281" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <path d="M 528 460 H 462 V 525 H 429" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Bottom row boxes (y=504) -->
    <!-- 판매가 수정 (직영점) -->
    <rect x="64" y="504" width="152" height="42" rx="7" class="box-teal" stroke-width="0.6"/>
    <text x="140" y="525" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-teal">판매가 수정</text>

    <!-- 수정요청 적용유무 (본사) -->
    <rect x="281" y="504" width="148" height="42" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="519" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">수정요청</text>
    <text x="355" y="535" text-anchor="middle" dominant-baseline="central" font-size="11" class="txt-blue">적용유무</text>

    <!-- 판매가 수정 (가맹점) -->
    <rect x="480" y="504" width="152" height="42" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="525" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-purple">판매가 수정</text>

    <!-- 판매가 수정 (외주) -->
    <rect x="666" y="504" width="140" height="42" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="525" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-coral">판매가 수정</text>

  </svg>

  <div class="legend">
    <span><i class="dot" style="background:#1D9E75;opacity:.8"></i>직영점</span>
    <span><i class="dot" style="background:#185fa5;opacity:.8"></i>본사</span>
    <span><i class="dot" style="background:#534ab7;opacity:.8"></i>가맹점</span>
    <span><i class="dot" style="background:#993c1d;opacity:.8"></i>외주센터 (사입)</span>
    <span><i class="dot" style="background:#854f0b;opacity:.8; transform:rotate(45deg)"></i>판단 (반영)</span>
  </div>
</div>
</body>
</html>
