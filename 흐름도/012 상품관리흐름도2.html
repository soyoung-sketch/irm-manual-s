<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품관리 흐름도 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 900px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }
  svg text { font-family: inherit; }
  .box-blue   { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal   { fill: #e1f5ee; stroke: #0f6e56; }
  .box-purple { fill: #eeedfe; stroke: #534ab7; }
  .box-coral  { fill: #faece7; stroke: #993c1d; }
  .txt-blue   { fill: #0c447c; }
  .txt-teal   { fill: #085041; }
  .txt-purple { fill: #3c3489; }
  .txt-coral  { fill: #712b13; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: #555; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>2. 상품관리 – 본사 ↔ 가맹점 상품 등록 흐름도 &nbsp;(2 / 3)</h2>

  <svg width="100%" viewBox="0 0 820 590" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="819" height="589" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>

    <!-- Header bg -->
    <rect x="0" y="0" width="820" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="820" height="8" fill="#f0f0f0"/>

    <!-- 헤더 테두리 (하단선 제외, 상단만 라운드) -->
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 810 0.5 Q 819.5 0.5 819.5 10 L 819.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column dividers -->
    <line x1="44"  y1="48" x2="44"  y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="240" y1="48" x2="240" y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="470" y1="48" x2="470" y2="590" stroke="#ddd" stroke-width="0.8"/>
    <line x1="650" y1="48" x2="650" y2="590" stroke="#ddd" stroke-width="0.6" stroke-dasharray="5 3"/>

    <!-- Section divider -->
    <line x1="0" y1="316" x2="820" y2="316" stroke="#ddd" stroke-width="0.8"/>

    <!-- Column headers -->
    <text x="142" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">직영점</text>
    <text x="355" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">본사</text>
    <text x="648" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">가맹점 &amp; 외주센터</text>

    <!-- 매입가수정: 섹션 중앙 y=(48+316)/2=182, 5글자×16px=80 → 시작142 -->
    <text x="22" y="142" text-anchor="middle" font-size="11" fill="#888">매</text>
    <text x="22" y="158" text-anchor="middle" font-size="11" fill="#888">입</text>
    <text x="22" y="174" text-anchor="middle" font-size="11" fill="#888">가</text>
    <text x="22" y="190" text-anchor="middle" font-size="11" fill="#888">수</text>
    <text x="22" y="206" text-anchor="middle" font-size="11" fill="#888">정</text>

    <!-- 행사가적용: 섹션 중앙 y=(316+590)/2=453, 5글자×16px=80 → 시작413 -->
    <text x="22" y="413" text-anchor="middle" font-size="11" fill="#888">행</text>
    <text x="22" y="429" text-anchor="middle" font-size="11" fill="#888">사</text>
    <text x="22" y="445" text-anchor="middle" font-size="11" fill="#888">가</text>
    <text x="22" y="461" text-anchor="middle" font-size="11" fill="#888">적</text>
    <text x="22" y="477" text-anchor="middle" font-size="11" fill="#888">용</text>

    <!-- ════ SECTION 1: 매입가수정 (y=48~316) ════ -->

    <!-- Row 1 (y=60, h=48, two-line) -->
    <rect x="281" y="60" width="148" height="48" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="78" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-blue">가맹상품 매입가</text>
    <text x="355" y="96" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="txt-blue">수정 공지</text>

    <rect x="666" y="60" width="140" height="48" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="78" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" class="txt-coral">사입상품 매입가</text>
    <text x="736" y="96" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="txt-coral">변경 등록</text>

    <!-- 본사 row1→row2, 외주 row1→row4 (long) -->
    <line x1="355" y1="108" x2="355" y2="132" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="736" y1="108" x2="736" y2="266" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 2 (y=132, h=40) -->
    <rect x="64"  y="132" width="152" height="40" rx="7" class="box-teal"   stroke-width="0.6"/>
    <text x="140" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">수정공지 수신</text>

    <rect x="281" y="132" width="148" height="40" rx="7" class="box-blue"   stroke-width="0.6"/>
    <text x="355" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">수정공지 전송</text>

    <rect x="480" y="132" width="152" height="40" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-purple">수정공지 수신</text>

    <line x1="216" y1="152" x2="281" y2="152" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="429" y1="152" x2="480" y2="152" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 본사 row2→row3 -->
    <line x1="355" y1="172" x2="355" y2="200" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 3 (y=200, h=40, 본사 only) -->
    <rect x="281" y="200" width="148" height="40" rx="7" class="box-blue" stroke-width="0.6"/>
    <text x="355" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">매입가 수정</text>

    <!-- 본사 row3→row4 -->
    <line x1="355" y1="240" x2="355" y2="266" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 4 (y=266, h=40) -->
    <rect x="64"  y="266" width="152" height="40" rx="7" class="box-teal"   stroke-width="0.6"/>
    <text x="140" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">매입가 수정</text>

    <rect x="281" y="266" width="148" height="40" rx="7" class="box-blue"   stroke-width="0.6"/>
    <text x="355" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">매입가 수정 전송</text>

    <rect x="480" y="266" width="152" height="40" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-purple">매입가 수정</text>

    <rect x="666" y="266" width="140" height="40" rx="7" class="box-coral"  stroke-width="0.6"/>
    <text x="736" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-coral">매입가 수정</text>

    <line x1="216" y1="286" x2="281" y2="286" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="429" y1="286" x2="480" y2="286" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- ════ SECTION 2: 행사가적용 (y=316~590) ════ -->

    <!-- Row 1 (y=334, h=40) -->
    <rect x="281" y="334" width="148" height="40" rx="7" class="box-blue"  stroke-width="0.6"/>
    <text x="355" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">가맹상품 행사등록</text>

    <rect x="666" y="334" width="140" height="40" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-coral">사입상품 행사등록</text>

    <!-- row1→row2 -->
    <line x1="355" y1="374" x2="355" y2="402" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="736" y1="374" x2="736" y2="402" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 2 (y=402, h=40) -->
    <rect x="281" y="402" width="148" height="40" rx="7" class="box-blue"  stroke-width="0.6"/>
    <text x="355" y="422" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">행사판매가 등록</text>

    <rect x="666" y="402" width="140" height="40" rx="7" class="box-coral" stroke-width="0.6"/>
    <text x="736" y="422" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-coral">행사판매가 등록</text>

    <!-- row2→row3 -->
    <line x1="355" y1="442" x2="355" y2="478" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="736" y1="442" x2="736" y2="478" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Row 3 (y=478, h=40) -->
    <rect x="64"  y="478" width="152" height="40" rx="7" class="box-teal"   stroke-width="0.6"/>
    <text x="140" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">행사판매가 적용</text>

    <rect x="281" y="478" width="148" height="40" rx="7" class="box-blue"   stroke-width="0.6"/>
    <text x="355" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">행사판매가 전송</text>

    <rect x="480" y="478" width="152" height="40" rx="7" class="box-purple" stroke-width="0.6"/>
    <text x="556" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-purple">행사판매가 적용</text>

    <rect x="666" y="478" width="140" height="40" rx="7" class="box-coral"  stroke-width="0.6"/>
    <text x="736" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-coral">행사판매가 적용</text>

    <line x1="216" y1="498" x2="281" y2="498" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="429" y1="498" x2="480" y2="498" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  </svg>

  <div class="legend">
    <span><i class="dot" style="background:#1D9E75;opacity:.8"></i>직영점</span>
    <span><i class="dot" style="background:#185fa5;opacity:.8"></i>본사</span>
    <span><i class="dot" style="background:#534ab7;opacity:.8"></i>가맹점</span>
    <span><i class="dot" style="background:#993c1d;opacity:.8"></i>외주센터 (사입)</span>
  </div>
</div>
</body>
</html>
