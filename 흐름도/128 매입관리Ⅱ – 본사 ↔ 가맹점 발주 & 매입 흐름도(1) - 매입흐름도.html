<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매입흐름도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 960px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }
  svg text { font-family: inherit; }
  .box-blue   { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal   { fill: #e1f5ee; stroke: #0f6e56; }
  .box-amber  { fill: #f8eedb; stroke: #854f0b; }
  .txt-blue   { fill: #0c447c; }
  .txt-teal   { fill: #085041; }
  .txt-amber  { fill: #633806; }
</style>
</head>
<body>
<div class="wrap">
  <h2>4. 매입관리Ⅱ – 본사 ↔ 가맹점 발주 &amp; 매입 흐름도 &nbsp;(1 / 2) - 매입흐름도</h2>
  <svg width="100%" viewBox="0 0 880 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#888"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#185fa5"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="879" height="759" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>

    <!-- Header bg -->
    <rect x="0" y="0" width="880" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="880" height="8" fill="#f0f0f0"/>
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 870 0.5 Q 879.5 0.5 879.5 10 L 879.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column dividers -->
    <line x1="44"  y1="48" x2="44"  y2="760" stroke="#ddd" stroke-width="0.8"/>
    <line x1="337" y1="48" x2="337" y2="760" stroke="#ddd" stroke-width="0.8"/>

    <!-- Column headers -->
    <text x="190" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">가맹점</text>
    <text x="608" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">본사</text>

    <!-- 행 라벨: 매입흐름도 -->
    <text x="22" y="350" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">매</text>
    <text x="22" y="366" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">입</text>
    <text x="22" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">흐</text>
    <text x="22" y="398" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">름</text>
    <text x="22" y="414" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">도</text>
    <!-- ════ 발주관리 dashed box (가맹점) ════ -->
    <rect x="89" y="66" width="204" height="660" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="105" y="83" font-size="11" font-weight="600" fill="#777">발주관리</text>

    <!-- 가맹점 박스들 center x=233, width=144 -->

    <!-- 발주서 등록 -->
    <rect x="119" y="96" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">발주서 등록</text>

    <!-- 발주서 등록 → 발주서 입력 -->
    <line x1="191" y1="128" x2="191" y2="181" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="149" y="147" width="84" height="14" rx="2" fill="white"/>
    <text x="191" y="154" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">발주서 작성 후 저장</text>

    <!-- 발주서 입력 -->
    <rect x="119" y="181" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">발주서 입력</text>

    <!-- 발주서 입력 → 발주 대기 -->
    <line x1="191" y1="213" x2="191" y2="266" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="163" y="233" width="56" height="14" rx="2" fill="white"/>
    <text x="191" y="240" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">대기로 이동</text>

    <!-- 발주 대기 -->
    <rect x="119" y="266" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">발주 대기</text>

    <!-- 발주 대기 → 발주 완료 (발주서 전송 라벨) -->
    <line x1="191" y1="298" x2="191" y2="371" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="163" y="317" width="56" height="14" rx="2" fill="white"/>
    <text x="191" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">발주서 전송</text>

    <!-- 발주 완료 -->
    <rect x="119" y="371" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="387" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">발주 완료</text>

    <!-- 발주 완료 → 입고 대기 -->

    <!-- 입고 대기 -->
    <rect x="119" y="521" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="537" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">입고 대기</text>

    <!-- 입고 대기 → 입고 완료 -->
    <line x1="191" y1="553" x2="191" y2="606" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="152" y="573" width="78" height="14" rx="2" fill="white"/>
    <text x="191" y="580" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">매입검수 시작</text>
    <!-- 매입검수시작 좌측 → ① 파란선 -->
    <path d="M 152 580 H 80 V 700 H 177" fill="none" stroke="#185fa5" stroke-width="1" marker-end="url(#arr-blue)"/>

    <!-- 입고 완료 -->
    <rect x="119" y="606" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="191" y="622" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">입고 완료</text>

    <!-- 1번 원형 뱃지 -->
    <circle cx="191" cy="700" r="14" fill="#185fa5"/>
    <text x="191" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="white">1</text>

    <!-- ════ 주문서관리 dashed box (본사 좌측) ════ -->
    <rect x="364" y="66" width="489" height="660" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="380" y="83" font-size="11" font-weight="600" fill="#777">주문서관리</text>

    <!-- 본사 박스들 center x=591, width=144 -->

    <!-- 주문서 등록 -->
    <rect x="474" y="96" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="546" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">주문서 등록</text>

    <!-- 주문서 등록 → 주문서 입력 -->
    <line x1="546" y1="128" x2="546" y2="208" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="504" y="161" width="84" height="14" rx="2" fill="white"/>
    <text x="546" y="168" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">주문서 작성 후 저장</text>

    <!-- 주문서 입력 -->
    <rect x="474" y="208" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="546" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">주문서 입력</text>

    <!-- 주문서 입력 → 출고/매입/생산 계획 -->
    <line x1="546" y1="240" x2="546" y2="320" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="511" y="273" width="70" height="14" rx="2" fill="white"/>
    <text x="546" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">계획으로 이동</text>

    <!-- 출고/매입/생산 계획 (두줄, y=320~364, center=342) -->
    <rect x="474" y="320" width="144" height="44" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="546" y="337" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">출고/매입/생산</text>
    <text x="546" y="353" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">계획</text>

    <!-- 발주서 전송 하단 세로선(x=233,y=342) → 출고/매입/생산 계획 (cross arrow) -->
    <line x1="191" y1="342" x2="474" y2="342" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 출고/매입/생산 계획 → 재고가 있는가? diamond -->
    <line x1="546" y1="364" x2="546" y2="392" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 재고가 있는가? 육각형 (center 591, 448, width=144) -->
    <polygon points="546,392 618,410 618,446 546,464 474,446 474,410" class="box-amber" stroke-width="0.6"/>
    
    <text x="546" y="428" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" class="txt-amber">재고가있는가?</text>

    <!-- 충분 (왼쪽 꼭짓점 → 포장중) -->
    <path d="M 474 428 H 394 V 660 H 474" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="414" y="418" width="40" height="20" rx="3" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
    <text x="434" y="428" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#0c447c">충분</text>

    <!-- 부족 → 발주계획 → 상품준비중 균등 간격 -->
    <line x1="546" y1="464" x2="546" y2="483" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="526" y="483" width="40" height="20" rx="3" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.8"/>
    <text x="546" y="493" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#a32d2d">부족</text>

    <!-- 발주계획 라벨 -->
    <line x1="546" y1="503" x2="546" y2="522" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="511" y="522" width="70" height="14" rx="2" fill="white"/>
    <text x="546" y="529" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">발주계획</text>
    <!-- 발주계획 하단 → 상품준비중 -->
    <line x1="546" y1="536" x2="546" y2="554" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 상품준비중 -->
    <rect x="474" y="554" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="546" y="570" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">상품준비중</text>

    <!-- 상품준비중 → 포장중 -->
    <line x1="546" y1="586" x2="546" y2="645" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="518" y="608" width="56" height="14" rx="2" fill="white"/>
    <text x="546" y="615" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">포장시작</text>

    <!-- 포장중 -->
    <rect x="474" y="645" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="546" y="661" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">포장중</text>

    <!-- 포장중 하단 → 입고 대기 (배송완료 아래 y=750으로 우회) -->
    <path d="M 546 677 V 713 H 337 V 537 H 263" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 포장중 → 출고대기중 (오른쪽) -->
    <line x1="618" y1="661" x2="703" y2="661" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="634" y="654" width="52" height="14" rx="2" fill="white"/>
    <text x="660" y="661" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">출고준비중</text>

    <!-- ════ 우측 출고 박스들 (본사 우측) center x=790, width=144 ════ -->

    <!-- 출고대기중 -->
    <rect x="703" y="645" width="120" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="763" y="661" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">출고대기중</text>

    <!-- 출고대기중 → 출고완료(배송) -->
    <line x1="763" y1="645" x2="763" y2="586" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="732" y="608" width="62" height="14" rx="2" fill="white"/>
    <text x="763" y="615" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">배송시작</text>
    <!-- 배송시작 우측 → ② 파란선 -->
    <path d="M 794 615 H 860 V 700 H 837" fill="none" stroke="#185fa5" stroke-width="1" marker-end="url(#arr-blue)"/>

    <!-- 출고완료(배송) -->
    <rect x="703" y="554" width="120" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="763" y="570" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">출고완료(배송)</text>

    <!-- 출고완료(배송) → 배송완료 -->
    <line x1="763" y1="554" x2="763" y2="459" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="732" y="499" width="62" height="14" rx="2" fill="white"/>
    <text x="763" y="506" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">배송완료</text>

    <!-- 배송완료 -->
    <rect x="703" y="427" width="120" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="763" y="443" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">배송완료</text>

    <!-- 2번 원형 뱃지 -->
    <circle cx="823" cy="700" r="14" fill="#185fa5"/>
    <text x="823" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="white">2</text>

  </svg>
</div>
</body>
</html>
