<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출관리 주문서 흐름도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 960px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }
  svg text { font-family: inherit; }
  .box-blue  { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal  { fill: #e1f5ee; stroke: #0f6e56; }
  .box-gray  { fill: #f4f4f4; stroke: #999; }
  .box-coral { fill: #faece7; stroke: #993c1d; }
  .txt-blue  { fill: #0c447c; }
  .txt-teal  { fill: #085041; }
  .txt-gray  { fill: #444; }
  .txt-coral { fill: #7a2e12; }
</style>
</head>
<body>
<div class="wrap">
  <h2>6. 매출관리Ⅱ – 주문서 흐름도</h2>

  <svg width="100%" viewBox="0 0 880 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#888"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#185fa5"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="879" height="759" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>
    <!-- Header bg -->
    <rect x="0" y="0" width="880" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="880" height="8" fill="#f0f0f0"/>
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 870 0.5 Q 879.5 0.5 879.5 10 L 879.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column divider -->
    <line x1="44" y1="48" x2="44" y2="760" stroke="#ddd" stroke-width="0.8"/>

    <!-- Header -->
    <text x="462" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">사업장</text>

    <!-- 행 라벨 -->
    <text x="22" y="340" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">발</text>
    <text x="22" y="356" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">주</text>
    <text x="22" y="372" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">계</text>
    <text x="22" y="388" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">획</text>

    <!-- ════ 주문서등록 dashed box ════ -->
    <rect x="60" y="66" width="260" height="160" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="76" y="83" font-size="11" font-weight="600" fill="#777">주문서등록</text>

    <!-- 주문서 작성 -->
    <rect x="118" y="110" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="190" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">주문서 작성</text>

    <!-- 저장 → 주문서 입력 -->
    <line x1="262" y1="126" x2="436" y2="126" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="295" y="119" width="40" height="14" rx="2" fill="white"/>
    <text x="315" y="126" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">저장</text>

    <!-- 주문서 작성 → 주문 → 매출처 (아래로) -->
    <line x1="190" y1="142" x2="190" y2="320" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="170" y="220" width="40" height="14" rx="2" fill="white"/>
    <text x="190" y="227" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">주문</text>

    <!-- 매출처 박스 -->
    <rect x="118" y="320" width="144" height="32" rx="6" class="box-coral" stroke-width="0.6"/>
    <text x="190" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-coral">매출처</text>

    <!-- ════ 주문서 조회 dashed box ════ -->
    <rect x="340" y="66" width="520" height="644" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="356" y="83" font-size="11" font-weight="600" fill="#777">주문서 조회</text>

    <!-- 주문서 입력 -->
    <rect x="436" y="110" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="508" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">주문서 입력</text>

    <!-- 주문서 입력 → 출매생 취소 (양방향) -->
    <path d="M 580 126 H 770 V 210" fill="none" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>

    <!-- 주문서 입력 → 출/매/생 계획 (출고대기중 라벨) -->
    <line x1="508" y1="142" x2="508" y2="210" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="480" y="169" width="56" height="14" rx="2" fill="white"/>
    <text x="508" y="176" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">출고대기중</text>

    <!-- 출/매/생 계획 -->
    <rect x="436" y="210" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="508" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">출/매/생 계획</text>

    <!-- 출/매/생 계획 ↔ 취소 (우측, 양방향) -->
    <line x1="580" y1="226" x2="720" y2="226" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>

    <!-- 취소 박스 (우측 하단) -->
    <rect x="720" y="210" width="100" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="770" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">취소</text>

    <!-- 출/매/생 계획 → 상품준비중 (발주계획 라벨) -->
    <line x1="508" y1="242" x2="508" y2="320" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="480" y="268" width="56" height="14" rx="2" fill="white"/>
    <text x="508" y="275" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">발주계획</text>

    <!-- 상품준비중 -->
    <rect x="436" y="320" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="508" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">상품준비중</text>

    <!-- 출/매/생 계획 좌측 → 포장중 (포장시작 라벨) -->
    <path d="M 436 226 H 390 V 402 H 436" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="362" y="299" width="56" height="14" rx="2" fill="white"/>
    <text x="390" y="306" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">포장시작</text>

    <!-- 상품준비중 → 포장중 (포장시작 라벨) -->
    <line x1="508" y1="352" x2="508" y2="402" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="480" y="370" width="56" height="14" rx="2" fill="white"/>
    <text x="508" y="377" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">포장시작</text>

    <!-- 포장중 -->
    <rect x="436" y="402" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="508" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">포장중</text>

    <!-- 포장중 → 출고대기중 -->
    <line x1="508" y1="434" x2="508" y2="494" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 출고대기중 -->
    <rect x="436" y="494" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="508" y="510" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">출고대기중</text>

    <!-- 출고대기중 → 출고완료 (배송시작 라벨) -->
    <line x1="508" y1="526" x2="508" y2="580" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="480" y="546" width="56" height="14" rx="2" fill="white"/>
    <text x="508" y="553" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">배송시작</text>

    <!-- 출고완료 -->
    <rect x="436" y="580" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="508" y="596" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">출고완료</text>

    <!-- 출고완료 → 출고완료 하단 (주문서완료 라벨) -->
    <line x1="508" y1="612" x2="508" y2="648" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="480" y="623" width="56" height="14" rx="2" fill="white"/>
    <text x="508" y="630" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">주문서완료</text>

    <!-- 출고완료 (최종) -->
    <rect x="436" y="648" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="508" y="664" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">출고완료</text>

    <!-- ════ 판매 조회 dashed box ════ -->
    <rect x="60" y="530" width="260" height="166" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="76" y="547" font-size="11" font-weight="600" fill="#777">판매 조회</text>

    <!-- 판매(출고)대기 -->
    <rect x="118" y="570" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="190" y="586" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">판매(출고)대기</text>

    <!-- 출고대기중 → 판매(출고)대기 (파란선) -->
    <path d="M 436 510 H 190 V 570" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- ════ 본사↔가맹점 프로세스 dashed box ════ -->
    <rect x="630" y="530" width="206" height="130" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="646" y="547" font-size="11" font-weight="600" fill="#777">본사↔가맹점 프로세스</text>

    <!-- 반려 박스 -->
    <rect x="685" y="574" width="96" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="733" y="590" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">반려</text>

  </svg>
</div>
</body>
</html>
