<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매입관리 매입 흐름도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 16px; }
  .wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); padding: 28px 28px 24px; max-width: 960px; width: 100%; }
  h2 { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 18px; letter-spacing: -.01em; }
  svg text { font-family: inherit; }
  .box-blue  { fill: #e6f1fb; stroke: #185fa5; }
  .box-teal  { fill: #e1f5ee; stroke: #0f6e56; }
  .box-gray  { fill: #f4f4f4; stroke: #999; }
  .txt-blue  { fill: #0c447c; }
  .txt-teal  { fill: #085041; }
  .txt-gray  { fill: #444; }
</style>
</head>
<body>
<div class="wrap">
  <h2>4. 매입관리Ⅱ – 매입 흐름도</h2>

  <svg width="100%" viewBox="0 0 880 660" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#888"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L9 5 L0 10 Z" fill="#185fa5"/>
      </marker>
      <marker id="arr-bold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L9 5 L0 10 Z" fill="#185fa5"/>
      </marker>
      <marker id="arr-bold-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M9 0 L0 5 L9 10 Z" fill="#185fa5"/>
      </marker>
    </defs>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="879" height="659" fill="none" stroke="#ccc" stroke-width="0.8" rx="10"/>
    <!-- Header bg -->
    <rect x="0" y="0" width="880" height="48" fill="#f0f0f0" rx="10"/>
    <rect x="0" y="40" width="880" height="8" fill="#f0f0f0"/>
    <path d="M 0.5 48 L 0.5 10 Q 0.5 0.5 10 0.5 L 870 0.5 Q 879.5 0.5 879.5 10 L 879.5 48" fill="none" stroke="#ccc" stroke-width="0.8"/>

    <!-- Column divider -->
    <line x1="44" y1="48" x2="44" y2="660" stroke="#ddd" stroke-width="0.8"/>

    <!-- Header -->
    <text x="462" y="29" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">사업장</text>

    <!-- 행 라벨: 발주계획 -->
    <text x="22" y="330" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">발</text>
    <text x="22" y="346" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">주</text>
    <text x="22" y="362" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">계</text>
    <text x="22" y="378" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333">획</text>

    <!-- ════ 매입 등록 dashed box ════ -->
    <rect x="60" y="66" width="280" height="190" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="76" y="83" font-size="11" font-weight="600" fill="#777">매입 등록</text>

    <!-- 매입전표 작성 -->
    <rect x="128" y="108" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="200" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">매입전표 작성</text>

    <!-- 저장 → 매입 입력 -->
    <line x1="272" y1="124" x2="456" y2="124" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="344" y="117" width="40" height="14" rx="2" fill="white"/>
    <text x="364" y="124" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#aaa">저장</text>

    <!-- 발주서 불러오기 → 매입전표 작성 (파란 화살표 위로) -->
    <text x="200" y="228" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#777">발주서 불러오기</text>
    <line x1="200" y1="218" x2="200" y2="140" stroke="#185fa5" stroke-width="1" marker-end="url(#arr-blue)"/>

    <!-- ════ 매입 조회 dashed box ════ -->
    <rect x="380" y="66" width="470" height="344" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 3"/>
    <text x="396" y="83" font-size="11" font-weight="600" fill="#777">매입 조회</text>

    <!-- 매입 입력 -->
    <rect x="456" y="108" width="144" height="32" rx="6" class="box-blue" stroke-width="0.6"/>
    <text x="528" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-blue">매입 입력</text>


    <!-- 매입 입력 ↔ 취소 (양방향) -->
    <path d="M 600 124 H 760 V 228" fill="none" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>

    <!-- 매입 입력 → 입고 대기 -->
    <line x1="528" y1="140" x2="528" y2="228" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 입고 대기 -->
    <rect x="456" y="228" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="528" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">입고 대기</text>

    <!-- 입고 대기 ↔ 취소 (우측, 양방향) -->
    <line x1="600" y1="244" x2="690" y2="244" stroke="#888" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>

    <!-- 취소 box 하단 -->
    <rect x="690" y="228" width="140" height="32" rx="6" class="box-gray" stroke-width="0.6"/>
    <text x="760" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-gray">취소</text>


    <!-- 입고 대기 → 매입완료 -->
    <line x1="528" y1="260" x2="528" y2="348" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

    <!-- 매입완료 -->
    <rect x="456" y="348" width="144" height="32" rx="6" class="box-teal" stroke-width="0.6"/>
    <text x="528" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" class="txt-teal">매입완료</text>

    <!-- ════ 재고 수불 발생 양방향 화살표 ════ -->
    <line x1="615" y1="410" x2="615" y2="552" stroke="#185fa5" stroke-width="2.5" marker-start="url(#arr-bold-rev)" marker-end="url(#arr-bold)"/>
    <rect x="547" y="470" width="136" height="22" rx="2" fill="white"/>
    <text x="615" y="481" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#185fa5">재고 수불 발생</text>

    <!-- ════ 재고 관리 박스 (매입조회 하단) ════ -->
    <rect x="380" y="552" width="470" height="60" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="0.8"/>
    <text x="615" y="582" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444">재고 관리</text>

  </svg>
</div>
</body>
</html>
