  <g id="hlp"><circle cx="8" cy="8" r="6.6" fill="none" stroke="#4676c8" stroke-width="1.5"/><text x="8" y="11.4" font-size="9.5" font-weight="700" fill="#4676c8" text-anchor="middle" font-family="Arial">?</text></g>
  <g id="rst" fill="none" stroke="#e2241a" stroke-width="1.6"><path d="M13.4 6 A5.6 5.6 0 1 0 14 9.4" stroke-linecap="round"/><path d="M13.9 2.2 L14 6.4 L10.2 5.2 Z" fill="#e2241a" stroke="none"/></g>
  <g id="exl"><rect width="16" height="16" rx="2.5" fill="#217346"/><text x="8" y="12" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">X</text></g>
