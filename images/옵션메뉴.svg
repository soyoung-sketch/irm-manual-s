<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>옵션 메뉴 구조도</title>
