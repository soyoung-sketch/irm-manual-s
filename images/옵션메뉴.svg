  <g id="disk"><path d="M1 1 h11 l3 3 v11 h-15 z" fill="#4676c8"/><rect x="4.5" y="1.6" width="6" height="4.4" fill="#dbe7fb"/><rect x="3.2" y="8.8" width="9.6" height="5.6" rx="0.6" fill="#dbe7fb"/></g>
  <g id="lay" fill="none" stroke="#4676c8" stroke-width="1.5"><rect x="1.6" y="2.4" width="12.8" height="11.4" rx="1.4"/><line x1="6" y1="2.4" x2="6" y2="13.8"/><line x1="6" y1="7.8" x2="14.4" y2="7.8"/></g>
